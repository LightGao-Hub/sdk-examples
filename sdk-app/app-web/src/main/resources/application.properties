tenant.order.name=macbook

spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.druid.url=jdbc:mysql://127.0.0.1:3306/test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.druid.username=root
spring.datasource.druid.password=Zuen.123@

# Druid
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=300000
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false
spring.datasource.druid.pool-prepared-statements=true
spring.datasource.druid.max-pool-prepared-statement-per-connection-size=20
spring.datasource.druid.filters=stat,wall
spring.datasource.druid.filter.wall.config.procedureAllow=true
spring.datasource.druid.filter.wall.config.ifStatementAllow=true


# Flyway 配置
spring.flyway.enabled=true
# flyway 的 clean 操作会清空 schema 下的所有 table, 生产环境务必禁用.
spring.flyway.cleanDisabled=true 
# Flyway 脚本编码设置为 UTF-8
spring.flyway.encoding=UTF-8
# Flyway 脚本存放路径为 db/migration
spring.flyway.locations=classpath:db/migration
# 迁移脚本的文件名前缀为 V
spring.flyway.sql-migration-prefix=V
# 迁移脚本的分隔符为__
spring.flyway.sql-migration-separator=__
# 迁移脚本的文件后缀为 .sql
spring.flyway.sql-migration-suffixes=.sql
# 迁移时是否校验脚本 true
spring.flyway.validate-on-migrate=true
# 当迁移时发现 schema_version 表不存在，是否自动执行 baseline
spring.flyway.baseline-on-migrate=true

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.alibaba.druid=DEBUG

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
